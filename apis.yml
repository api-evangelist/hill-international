aid: hill-international
name: Hill International
description: >-
  Hill International is a global construction consulting firm founded in 1976
  in Mt. Laurel, New Jersey, providing program, project, and construction
  management, project management oversight, claims and dispute resolution,
  estimating and cost management, facilities management, project monitoring,
  troubled project turnaround, commissioning, and project labor agreement
  consulting to public and private sector owners across more than 100 offices
  in 42 countries. In December 2022 Hill agreed to be acquired by Global
  Infrastructure Solutions, Inc. (GISI), the parent of STV, with the
  take-private transaction closing in May 2023 — Hill now operates as a GISI
  Consulting Group company alongside STV, GEI Consultants, LiRo-Hill, Layton
  Construction, and the broader GISI portfolio. Hill International is a
  professional services firm and does not publish a public developer API,
  OpenAPI specification, SDKs, or any developer portal.
